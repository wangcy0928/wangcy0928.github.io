<style>
/* Layout: centered title block + grouped index + image strip, then full-width split cards (media | text), dark-first with light toggle */
:root{
  color-scheme:dark;
  --bg:#101312; --top:#1a1d1c; --surface:#171a19; --surface-2:#212524;
  --text:#ecefed; --muted:#b4bdb9; --soft:#828c88; --line:#2f3533;
  --accent:#2aa3dc; --accent-warm:#f0906a; --go:#17864f; --go-line:#2fbf74; --go-hi:#20a863;
  --media:#1d2427; --media-ink:#c3ccd2;
  --shadow:0 18px 44px rgba(0,0,0,.35);
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f4f6f3; --top:#ffffff; --surface:#ffffff; --surface-2:#ecefeb;
  --text:#151817; --muted:#4e5954; --soft:#69736e; --line:#d5dad3;
  --accent:#006fa8; --accent-warm:#c25432; --go:#17864f; --go-line:#17864f; --go-hi:#1f9a5c;
  --media:#e3e8ea; --media-ink:#3b4a52;
  --shadow:0 14px 32px rgba(21,24,23,.10);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6f3; --top:#ffffff; --surface:#ffffff; --surface-2:#ecefeb;
  --text:#151817; --muted:#4e5954; --soft:#69736e; --line:#d5dad3;
  --accent:#006fa8; --accent-warm:#c25432; --go:#17864f; --go-line:#17864f; --go-hi:#1f9a5c;
  --media:#e3e8ea; --media-ink:#3b4a52;
  --shadow:0 14px 32px rgba(21,24,23,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0;overflow-wrap:anywhere}
h1,h2,h3{line-height:1.12;text-wrap:balance}

/* top */
.top{position:relative;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-top:6px solid var(--accent);background:linear-gradient(180deg,var(--top),var(--bg) 80%);text-align:center}
.theme{position:absolute;top:18px;right:max(16px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);cursor:pointer;font-size:18px;display:grid;place-items:center}
.theme:hover{border-color:var(--accent);color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden;margin-bottom:18px}
.lang button{min-width:56px;height:34px;border:0;background:transparent;color:var(--accent);cursor:pointer;font-weight:700}
.lang button+button{border-left:1px solid var(--accent)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.top h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.01em}
.tagline{margin-top:8px;font-size:clamp(16px,2vw,21px);font-style:italic;font-weight:500;color:var(--text)}
.meta{margin-top:8px;color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.meta a,.meta button.copy{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font:inherit}
.meta a:hover,.meta button.copy:hover{color:var(--accent-warm)}
.email{font-family:var(--mono);font-size:14px;user-select:all;color:var(--text)}

.index{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(980px,100%);margin:26px auto 0}
.index h2{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:10px}
.index ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.index a{color:var(--accent);font-weight:600;font-size:15px}
.index a:hover{color:var(--accent-warm)}
@media (max-width:700px){.index{grid-template-columns:1fr;gap:18px}}

.strip{position:relative;width:min(1120px,100%);margin:28px auto 0}
.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,26%);gap:14px;overflow-x:auto;scroll-snap-type:inline mandatory;
  padding:0 42px 10px;scrollbar-color:var(--accent) transparent}
.slide{scroll-snap-align:center;display:grid;gap:7px;min-width:0;color:var(--muted);font-weight:600;text-align:left}
.slide .thumb{height:clamp(120px,12vw,160px);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow)}
.slide span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide:hover{color:var(--accent)}
.arrow{position:absolute;top:0;z-index:2;width:32px;height:clamp(120px,12vw,160px);border:0;border-radius:6px;cursor:pointer;
  background:color-mix(in srgb,var(--surface-2) 85%,transparent);color:var(--text);font-size:30px;line-height:1}
.arrow:hover{color:var(--accent)}
.arrow.prev{left:0}.arrow.next{right:0}
@media (max-width:980px){.scroller{grid-auto-columns:minmax(200px,46%)}}
@media (max-width:560px){.scroller{grid-auto-columns:minmax(180px,74%);padding-inline:30px}.arrow{width:24px}}

/* drawings */
.thumb,.pmedia{background:var(--media);color:var(--media-ink);display:grid;place-items:center;padding:14px 18px}
.thumb svg,.pmedia svg{width:100%;height:100%;max-height:100%}
.thumb.photo,.pmedia.photo{padding:0;background:#fff;overflow:hidden}
.thumb.photo{background:#0c0e0d}
.thumb.photo img{width:100%;height:100%;object-fit:contain}
.pmedia.photo video{width:100%;height:100%;object-fit:contain;display:block}
.pmedia.split{display:grid;grid-template-columns:minmax(0,.89fr) minmax(0,1fr);gap:1px;padding:0;background:var(--line);place-items:stretch}
.pmedia.split .half{position:relative;overflow:hidden;min-height:0}
.pmedia.split .sim{background:#0c0e0d}
.pmedia.split .real{background:#0c0e0d}
.pmedia.split video{position:absolute;inset:0;width:100%;height:100%;display:block}
.pmedia.split .sim video{object-fit:contain}
.pmedia.split .real video{object-fit:contain}
.vlabel{position:absolute;left:10px;bottom:10px;padding:3px 9px;border-radius:4px;background:rgba(12,14,13,.72);color:#f2f5f3;font:600 12px var(--mono);letter-spacing:.04em}
@media (max-width:980px){.pmedia.split{aspect-ratio:7/6;min-height:0}}
.pmedia.split.stack{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.pmedia.split.stack .half{min-height:200px}
.pmedia.split.stack .sim{background:#e8edf2}
@media (max-width:980px){.pmedia.split.stack{aspect-ratio:8/9}}
.pmedia.photo.real{background:#0c0e0d}
.pmedia.photo.real video{position:absolute;inset:0}
.pmedia.photo.real{position:relative}
.pmedia.photo.real img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}

/* cards */
main{width:min(1400px,100%);margin:0 auto;padding-block:34px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.group-h{display:flex;align-items:baseline;gap:14px;padding-top:10px}
.group-h h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700;white-space:nowrap}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.card{scroll-margin-top:20px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr);gap:1px;border:1px solid var(--line);background:var(--line);overflow:hidden}
.pmedia{min-height:360px;padding:28px 36px}
.pbody{background:var(--surface);padding:clamp(22px,3.4vw,40px);display:flex;flex-direction:column;gap:16px;min-width:0}
.kicker{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;color:var(--soft);font-size:14px;font-weight:700;font-family:var(--mono)}
.tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;font-family:var(--sans)}
.tags span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);font-size:12.5px;font-weight:500}
.card h3{font-size:clamp(24px,2.8vw,36px);font-weight:700}
.sub{font-size:clamp(16px,1.7vw,19px);font-weight:600;line-height:1.4}
.org{font-size:14.5px;color:var(--soft)}
.metric{font-family:var(--mono);font-size:13px;color:var(--accent);border-left:2px solid var(--accent);padding-left:10px}
.pts{display:grid;gap:10px;color:var(--muted);max-width:68ch}
.cite,.note{font-size:14px;color:var(--soft)}
.cite a{color:var(--accent)}
.note{color:var(--accent-warm);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:auto;padding-top:4px}
.links a{display:inline-flex;align-items:center;min-height:36px;padding:6px 14px;border:1px solid var(--go-line);border-radius:4px;background:var(--go);color:#f4fff8;font-weight:700;font-size:14.5px}
.links a:hover{background:var(--go-hi)}
@media (max-width:980px){.card{grid-template-columns:1fr}.pmedia{min-height:260px;aspect-ratio:16/9;max-width:100%}}
@media (max-width:560px){.kicker{flex-direction:column}.tags{justify-content:flex-start}}

/* education + skills */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid var(--line);background:var(--line);margin-top:8px}
.facts > div{background:var(--surface);padding:clamp(20px,3vw,32px);display:grid;gap:14px;align-content:start;min-width:0}
.facts h3{font-size:20px}
.edu{display:grid;gap:4px}
.edu b{font-size:16px}
.edu span{color:var(--muted);font-size:15px}
.edu .d{font-family:var(--mono);font-size:13px;color:var(--soft)}
.sk{display:grid;gap:10px}
.sk p{color:var(--muted);font-size:15px}
.sk p b{color:var(--text);font-weight:600}
@media (max-width:820px){.facts{grid-template-columns:1fr}}

footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;border-top:1px solid var(--line);color:var(--soft);font-size:14px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
</style>

    zh:['100 Hz 闭环笛卡尔空间控制器：正运动学 + 位姿误差反馈 + 雅可比伪逆速度求解，在锁定姿态的前提下跟踪椭圆搅拌轨迹。','零空间投影让关节回到中位，多次循环不漂移。','Z 轴积分补偿把 200 g 负载下的末端下沉量从 15–20 mm 压到 2 mm 以内；速度限幅加低通滤波消除了原先离线回放方案的机械共振。','用 ROS/RViz 编写轨迹指令与实时可视化。结果：演示日全天零洒漏。','之后我从零把控制器重写成开源仿真：改为从上一次指令积分后，水平跟踪误差从课程版的 13.7 mm 降到 0.7 mm。']}},

    html+='<div class="group-h"><h2>'+L.g[g]+'</h2></div>';

        '<h3>'+x(p.t)+'</h3><p class="sub">'+x(p.s)+'</p><p class="org">'+x(p.o)+'</p><p class="metric">'+esc(p.m)+'</p>'+

        (p.cite?'<p class="cite">'+p.cite+'</p>':'')+(p.note?'<p class="note">'+x(p.note)+'</p>':'')+
